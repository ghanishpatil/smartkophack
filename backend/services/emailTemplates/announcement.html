<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="en">
<head>
	<title></title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<meta name="supported-color-schemes" content="light dark">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" type="text/css">
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" type="text/css">
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
		a[x-apple-data-detectors] { color: inherit !important; text-decoration: inherit !important; }
		#MessageViewBody a { color: inherit; text-decoration: none; }
		p { line-height: 1.6; margin: 0 0 16px 0; }
		img { max-width: 100%; height: auto; display: block; }
		
		/* Responsive */
		@media only screen and (max-width: 600px) {
			.email-container { width: 100% !important; }
			.stack-column { display: block !important; width: 100% !important; }
			.mobile-padding { padding: 20px !important; }
			.mobile-hide { display: none !important; max-height: 0 !important; overflow: hidden !important; }
			.banner-img { height: 200px !important; }
			.logo-img { width: 120px !important; }
			h1 { font-size: 24px !important; }
			h2 { font-size: 20px !important; }
		}
		
		/* Dark mode support */
		@media (prefers-color-scheme: dark) {
			.bg-light { background-color: #1a1a1a !important; }
			.text-dark { color: #ffffff !important; }
			.text-muted { color: #a0a0a0 !important; }
			.border-light { border-color: #333333 !important; }
		}
	</style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5;">
	<table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color: #f5f5f5;">
		<tbody>
			<tr>
				<td align="center" style="padding: 20px 0;">
					<!-- Main Container -->
					<table class="email-container" width="600" border="0" cellpadding="0" cellspacing="0" role="presentation" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
						<tbody>
							<!-- Top partner-logos banner -->
							<tr>
								<td align="center" style="padding: 0; background-color: #ffffff;">
									<img src="https://skh.sanjivaniuniversity.com/email-logos.png" alt="Partner logos" style="width: 100%; max-width: 600px; height: auto; margin: 0 auto; display: block;" />
								</td>
							</tr>
							<!-- Header: SKH animated logo -->
							<tr>
								<td align="center" style="padding: 40px 20px 10px 20px; background-color: #e6f4ff;">
									<img src="https://skh.sanjivaniuniversity.com/skh.gif" alt="Smart Kopargaon Hackathon" style="width: 100%; max-width: 440px; height: auto; margin: 0 auto; display: block;" />
								</td>
							</tr>
							<tr>
								<td align="center" style="padding: 0 20px 32px 20px; background-color: #e6f4ff;">
									<h2 style="margin: 0; color: #185983; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.3px;">Smart Kopargaon Hackathon</h2>
								</td>
							</tr>
							
							<!-- Content Section -->
							<tr>
								<td class="mobile-padding bg-light" style="padding: 20px 40px 40px 40px; background-color: #ffffff;">
									<h1 class="text-dark" style="margin: 0 0 20px 0; color: #1a1a1a; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 28px; font-weight: 700; line-height: 1.3; letter-spacing: -0.3px;">{{TITLE}}</h1>
									<div class="text-dark" style="color: #333333; font-size: 16px; line-height: 1.6;">
										{{MESSAGE}}
									</div>
									<div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
										<p style="margin: 0; color: #666666; font-size: 14px;">
											<strong style="color: #1a1a1a;">Smart Kopargaon Hackathon</strong><br>
											Powered by Sanjivani University
										</p>
									</div>
								</td>
							</tr>

							<!-- Footer -->
							<tr>
								<td class="mobile-padding" style="padding: 36px 40px 26px 40px; background-color: #185983; text-align: center;">
									<!-- Social icons -->
									<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin: 0 auto 18px auto;">
										<tbody>
											<tr>
												<td style="padding: 0 8px;">
													<a href="https://x.com/skhackathon" target="_blank" style="text-decoration: none;">
														<img src="https://skh.sanjivaniuniversity.com/email-x.png" alt="X" width="30" style="display: block; border: 0; width: 30px; height: 30px;" />
													</a>
												</td>
												<td style="padding: 0 8px;">
													<a href="https://instagram.com/smartkophack.su" target="_blank" style="text-decoration: none;">
														<img src="https://skh.sanjivaniuniversity.com/email-ig.png" alt="Instagram" width="30" style="display: block; border: 0; width: 30px; height: 30px;" />
													</a>
												</td>
											</tr>
										</tbody>
									</table>

									<p style="margin: 0 0 4px 0; font-size: 17px; font-weight: 700; color: #ffffff;">Smart Kopargaon Hackathon</p>
									<p style="margin: 0 0 16px 0; font-size: 13px; color: #a9d4ec;">Powered by Sanjivani University</p>

									<p style="margin: 0 0 6px 0; font-size: 14px;">
										<a href="https://skh.sanjivaniuniversity.com" target="_blank" style="color: #ffffff; text-decoration: underline; font-weight: 600;">skh.sanjivaniuniversity.com</a>
									</p>
									<p style="margin: 0; font-size: 13px; color: #a9d4ec;">
										Kopargaon, Maharashtra, India
									</p>
								</td>
							</tr>

							<!-- Copyright -->
							<tr>
								<td style="padding: 16px 20px; background-color: #124a6e; text-align: center;">
									<p style="margin: 0; font-size: 12px; color: #a9d4ec;">
										&copy; {{YEAR}} Smart Kopargaon Hackathon &middot; All rights reserved.
									</p>
								</td>
							</tr>
						</tbody>
					</table>
				</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
